<!DOCTYPE html>
<html>
<head>
    <title>Pseudocode Interpreter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>



    
    <h1>Pseudocode Interpreter</h1>

    <textarea id="code" rows="10" cols="60">name ← "John"
score ← 10

OUTPUT name
OUTPUT score</textarea>

    <br>
    <button onclick="insertArrow()">Insert ←</button>
    <button onclick="runCode()">Run</button>

    <h2>Output</h2>
    <pre id="output"></pre>

    <script src="interpreter.js"></script>
</body>
</html>
