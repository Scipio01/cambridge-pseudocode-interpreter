<!DOCTYPE html>
<html>
<head>
    <title>Cambridge iGCSE Pseudocode Interpreter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>




    <h1>Cambridge iGCSE Pseudocode Interpreter</h1>
<button onclick="toggleDarkMode()">Dark Mode</button>
<textarea id="code" rows="10" cols="60">DECLARE name : STRING
DECLARE score : INTEGER

name ← "Fred"
score ← 10

OUTPUT name
OUTPUT score</textarea>

    <br>
    <button onclick="insertArrow()">Insert ←</button>
    <button onclick="runCode()">Run</button>

    <h2>Output</h2>
    <pre id="output"></pre>

    <script src="interpreter.js"></script>
</body>
</html>
